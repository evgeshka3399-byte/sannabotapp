    - name: Install dependencies
      run: npm install

    # --- ВСТАВИТЬ ЭТОТ БЛОК ---
    - name: Generate Debug Keystore
      run: |
        keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
    # ---------------------------

    - name: Build Android App (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: npm install

    - name: Build Android App (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sanna-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
